name: Build Dongwon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore stable signing key
        env:
          DONGWON_KEYSTORE_B64: ${{ secrets.DONGWON_KEYSTORE_B64 }}
          DONGWON_STORE_PASSWORD: ${{ secrets.DONGWON_STORE_PASSWORD }}
          DONGWON_KEY_ALIAS: ${{ secrets.DONGWON_KEY_ALIAS }}
          DONGWON_KEY_PASSWORD: ${{ secrets.DONGWON_KEY_PASSWORD }}
        run: |
          test -n "$DONGWON_KEYSTORE_B64" || (echo "Missing DONGWON_KEYSTORE_B64" && exit 1)
          test -n "$DONGWON_STORE_PASSWORD" || (echo "Missing DONGWON_STORE_PASSWORD" && exit 1)
          test -n "$DONGWON_KEY_ALIAS" || (echo "Missing DONGWON_KEY_ALIAS" && exit 1)
          test -n "$DONGWON_KEY_PASSWORD" || (echo "Missing DONGWON_KEY_PASSWORD" && exit 1)

          echo "$DONGWON_KEYSTORE_B64" | base64 --decode > dongwon-release.jks

          echo "DONGWON_KEYSTORE_PATH=$PWD/dongwon-release.jks" >> "$GITHUB_ENV"
          echo "DONGWON_STORE_PASSWORD=$DONGWON_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DONGWON_KEY_ALIAS=$DONGWON_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DONGWON_KEY_PASSWORD=$DONGWON_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Extract Dongwon project
        run: |
          unzip -o GPT_Floating_Assistant_v2.0_stable_signing.zip
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dongwon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
